<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lemmings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120d0a">
<style>
  :root { --dark: #120d0a; --stone: #7a3c30; --stone-hi: #c88068; --stone-lo: #3a1810; }
  html, body {
    margin: 0; height: 100%; background: var(--dark); overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--dark); }
  #left { display: flex; flex-direction: column; flex: none; width: 100%; min-width: 0; overflow: hidden; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none; touch-action: none; }

  /* which pieces show in which layout (JS puts m-menu / m-desktop / m-portrait / m-landscape on <body>) */
  #panel, #minibox, #tpanel { display: none; }
  .m-desktop #panel { display: block; }
  .m-portrait #minibox, .m-landscape #minibox { display: flex; align-items: center; justify-content: center; background: #0b0806; }
  .m-portrait #minibox { flex: none; height: 56px; }
  .m-landscape #minibox { flex: 1 1 auto; min-height: 0; }
  .m-landscape #stage { flex-direction: row; }
  .m-landscape #left { width: auto; }
  .m-portrait #tpanel, .m-landscape #tpanel {
    display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; gap: 8px; box-sizing: border-box;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)) 8px; background: var(--dark);
  }
  .m-landscape #tpanel { padding-right: calc(8px + env(safe-area-inset-right)); }

  .grid { display: grid; gap: 8px; min-height: 0; }
  #skills { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); flex: 2 1 0; }
  #ctrls  { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr; flex: 1 1 0; }
  .m-landscape #ctrls { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); flex: 1.3 1 0; }

  .btn {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 3px; min-width: 0; min-height: 0; padding: 5px 3px 4px; box-sizing: border-box; overflow: hidden;
    background: linear-gradient(#8c4638, #6a3226); border: 3px solid; border-color: var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);
    border-radius: 3px; color: #f6e8d8; touch-action: none; cursor: pointer;
  }
  .btn .plate { flex: none; width: 62%; height: auto; image-rendering: pixelated; border-radius: 2px; }
  .btn .ico   { flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  .btn .lbl   { flex: none; font: 800 clamp(9px, 2.7vw, 13px)/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .6px; text-shadow: 0 1px 0 #000; pointer-events: none; }
  .btn.sel    { outline: 4px solid #f8e820; outline-offset: -4px; background: linear-gradient(#a85a40, #7e3c2c); }
  .btn.on     { outline: 4px solid #ffffff; outline-offset: -4px; }
  .btn.zero   { opacity: .45; }
  .btn.down   { filter: brightness(1.35); transform: translateY(1px); }
  #b-nuke.on  { background: linear-gradient(#c03010, #8a1c08); }
  #b-quit.on  { background: linear-gradient(#c02818, #801408); }
  #minibox canvas { touch-action: none; }
</style>
</head>
<body class="m-menu">
<div id="stage">
  <div id="left">
    <canvas id="screen"></canvas>
    <canvas id="panel"></canvas>
    <div id="minibox"><canvas id="tmini"></canvas></div>
  </div>
  <div id="tpanel"></div>
</div>
<script src="js/gfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>LM.app.init();</script>
</body>
</html>
